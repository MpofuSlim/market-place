version: 2
updates:

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      spring-ecosystem:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
          - "org.springframework.security*"
        update-types: ["minor", "patch"]
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
          - "tools.jackson*"
        update-types: ["minor", "patch"]
      netty:
        patterns:
          - "io.netty*"
        update-types: ["minor", "patch"]
      testcontainers:
        patterns:
          - "org.testcontainers*"
        update-types: ["minor", "patch"]
      observability:
        patterns:
          - "io.micrometer*"
          - "io.opentelemetry*"
          - "io.sentry*"
          - "net.logstash.logback*"
        update-types: ["minor", "patch"]

  # Single-service repo: the Dockerfile lives at the repo root, not under a
  # per-service subdirectory as in the ticketing monorepo.
  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "08:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "docker" }
    # No JDK major bumps from Dependabot: the base images, ci.yml/release.yml's
    # java-version and the pom's bytecode target move together, by hand, to an
    # LTS. A bot bump of the images alone is how the ticketing fleet once
    # shipped a non-LTS JDK whose frozen Alpine base failed the Trivy gate,
    # and how CI and the images drifted onto different JDKs. Remove this
    # ignore in the same PR that moves the JDK.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      docker-actions:
        patterns:
          - "docker/*"
