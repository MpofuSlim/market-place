name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/release.yml"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # OWASP A08 — build/artifact integrity. id-token lets the runner mint a
  # short-lived OIDC token for keyless signing; attestations lets it store the
  # SLSA build-provenance attestation. Both are only exercised on push (image
  # signing below is guarded off for pull_request events).
  id-token: write
  attestations: write

jobs:
  # Full test suite gates the image build: the Dockerfile builds with
  # -DskipTests, so without this job a merge could publish a fully-attested
  # image that was never tested (fleet rule — see InnBucksMiddleware2.0).
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-wrapper-

      - name: Bootstrap Maven wrapper (retry transient downloads)
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -ntp -version && exit 0
            echo "Maven wrapper bootstrap attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "::error::Maven wrapper bootstrap failed after 3 attempts (transient Maven Central download issue)."
          exit 1

      - name: Build + test + integration-test
        run: ./mvnw -B -ntp verify

  build:
    name: Build, scan, push (marketplace-service)
    runs-on: ubuntu-latest
    needs: test

    steps:
      # Third-party actions pinned to immutable commit SHAs (OWASP A08 —
      # supply-chain integrity); dependabot keeps the SHA + version comment in
      # sync. Never downgrade a pin back to a floating tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/mpofuslim/marketplace-service is the stable extraction
      # contract (see CLAUDE.md) — the fleet k8s Deployment references this
      # exact name, so it must never move.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/marketplace-service
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr

      # Build into the local docker daemon (load) WITHOUT pushing, so Trivy can
      # scan the exact image before it ever leaves the runner. Provenance/SBOM
      # attestations are NOT set here: they require the registry (image)
      # exporter, which is incompatible with `load: true` (docker exporter).
      # The push step below re-runs the build from the gha cache (near-instant)
      # with attestations enabled.
      - name: Build image (load for scanning, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=marketplace-service
          cache-to: type=gha,scope=marketplace-service,mode=max

      # A08 supply-chain: install Trivy from an IMMUTABLE version tag, never the
      # mutable `main` branch. This job holds packages:write + id-token:write +
      # attestations:write, so remote code piped to a shell here could push
      # malicious images and mint valid provenance attestations for them. Pin
      # both the installer script ref AND the installed version; bump
      # deliberately (Dependabot doesn't track this raw curl).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.69.3"
        run: |
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"

      # Gate: scan the LOADED local image and fail the job on any CRITICAL/HIGH
      # (os + library) before the push step runs. Scanning first makes Trivy an
      # actual push gate (OWASP A08 — don't publish a known-vulnerable artifact).
      - name: Scan image with Trivy
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          trivy image \
            --severity CRITICAL,HIGH \
            --vuln-type os,library \
            --exit-code 1 \
            --no-progress \
            --ignorefile .trivyignore \
            "$IMAGE"

      # Push only after the scan passes, and attach a signed SLSA provenance
      # attestation + an SBOM to the image in the registry (OWASP A08 —
      # verifiable build provenance / what-built-this). Cache-served from the
      # build step above, so this is fast. Skipped on pull_request.
      - name: Push image + attach provenance & SBOM
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=marketplace-service
          provenance: mode=max
          sbom: true

      # GitHub-native SLSA build-provenance attestation, signed keylessly via
      # the runner's OIDC identity and stored in GitHub. Lets anyone verify an
      # image digest was built by THIS repo's workflow:
      # `gh attestation verify oci://ghcr.io/<owner>/marketplace-service@<digest>`.
      #
      # Retry wrapper: fetching the OIDC identity token intermittently fails
      # ("error retrieving identity token / no tokens available"). The first
      # attempt runs with continue-on-error so a transient blip doesn't fail the
      # job outright; the second attempt (only when the first failed) refetches
      # the token and near-always succeeds. The RETRY step has NO
      # continue-on-error, so a genuine attestation failure still fails the job —
      # the OWASP A08 provenance guarantee is preserved, not weakened.
      - name: Attest build provenance
        id: attest
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/marketplace-service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (retry on transient OIDC failure)
        if: github.event_name != 'pull_request' && steps.attest.outcome == 'failure'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/marketplace-service
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
