spring:
  application:
    name: marketplace-service
  data:
    web:
      pageable:
        max-page-size: ${PAGEABLE_MAX_PAGE_SIZE:100}
        default-page-size: ${PAGEABLE_DEFAULT_PAGE_SIZE:20}
    # Shared Redis — read side of the cross-service logout denylist only (no
    # Spring Data Redis repositories). Same Redis the gateway / user-service /
    # loyalty and the rest of the fleet use.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace_service}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: marketplace-service-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only validates.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    # Listing image upload cap (PUT /marketplace/listings/{id}/image) —
    # mirrors event-service's 10 MB banner cap. ListingService re-checks the
    # size in code and GlobalExceptionHandler maps the container's rejection
    # to the same 400 image_too_large, so both layers speak one contract.
    # max-request-size leaves ~1 MB headroom for the multipart framing.
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

marketplace:
  order:
    # How long a PENDING_PAYMENT order holds its stock before the expiry
    # sweeper releases it. Mirrors the ticketing seat-hold philosophy: a
    # blocked unit of stock beats an oversell, but holds must always lapse.
    payment-ttl-minutes: ${MARKETPLACE_ORDER_PAYMENT_TTL_MINUTES:30}
    # Cap on line items per order and units per line — abuse guard, keeps a
    # single order from reserving a whole listing's stock via one request.
    max-items: ${MARKETPLACE_ORDER_MAX_ITEMS:20}
    max-quantity-per-item: ${MARKETPLACE_ORDER_MAX_QTY_PER_ITEM:25}
  listing:
    # Hard caps on merchant listing volume (abuse guard).
    max-per-merchant: ${MARKETPLACE_LISTING_MAX_PER_MERCHANT:500}
  scheduler:
    # Order-expiry sweep: releases stock held by lapsed PENDING_PAYMENT orders.
    expiry-sweep-cron: ${MARKETPLACE_EXPIRY_SWEEP_CRON:0 * * * * *}
    # Nightly tamper-evidence walk over the audit chain.
    audit-verify-cron: ${MARKETPLACE_AUDIT_VERIFY_CRON:0 30 3 * * *}
  audit:
    # Keyed HMAC sealing every audit row + the deletion-evident chain link.
    # Same design as user-service/payment-service (A09). Boot-required under a
    # deployment profile via ProductionSecretsGuard.
    hmac-secret: ${AUDIT_HMAC_SECRET:change-me-audit-hmac-secret-change-me-audit}
    # Newest-window row budget per nightly integrity walk.
    verify-limit: ${MARKETPLACE_AUDIT_VERIFY_LIMIT:5000}
  notifications:
    restock-alerts:
      # Back-in-stock alerts to favoriters via user-service's internal notify
      # endpoint (AFTER_COMMIT + async, never-throws).
      enabled: ${MARKETPLACE_RESTOCK_ALERTS_ENABLED:true}
      # Per-event recipient cap (oldest favorites win); overflow is logged +
      # metered marketplace.notifications{type=restock_alert,outcome=overflow}.
      max-recipients-per-event: ${MARKETPLACE_RESTOCK_ALERTS_MAX_RECIPIENTS:200}
    merchant-orders:
      # Merchant new-paid-order alerts. OFF by default: user-service has no
      # merchantId -> admin-users internal lookup yet (see CLAUDE.md
      # "Notifications" + notify/MerchantAdminResolver). Flip on only once
      # that endpoint + a real resolver bean exist.
      enabled: ${MARKETPLACE_MERCHANT_ORDER_ALERTS_ENABLED:false}

innbucks:
  country: ${INNBUCKS_COUNTRY:ZW}
  currency: ${INNBUCKS_CURRENCY:USD}
  # Shared S2S secret presented as X-Internal-Token on /marketplace/internal/**
  # by the payments service — and BY us on user-service's
  # /users/internal/{uuid}/notify (UserNotifyGateway). Constant-time compared
  # in the controller; the fleet gateway edge-denies the path ("three files
  # must agree").
  internal-api-token: ${INTERNAL_API_TOKEN:change-me-internal-token-change-me-internal-token}

# user-service, resolved by NAME through Eureka (lb via the @LoadBalanced
# builder) — never a hardcoded host:port. Consumed by UserNotifyGateway for
# the S2S notify endpoint (restock alerts, merchant order alerts).
user-service:
  base-url: http://user-service
  connect-timeout-ms: ${USER_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${USER_SERVICE_READ_TIMEOUT_MS:5000}

# External WhatsApp notification gateway — the FALLBACK channel for buyer
# order-paid alerts (third-party service, not in Eureka: explicit base-url).
# Same WHATSAPP_* env vars the rest of the fleet reads; blank api-key =
# channel disabled (boot-time WARN, graceful degradation — never a crash).
whatsapp:
  base-url: ${WHATSAPP_GATEWAY_URL:http://localhost:8089}
  api-key: ${WHATSAPP_API_KEY:}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:10000}

# InnBucks public notification API (buyer SMS; email available). Same API
# Gateway + BANK_API_* credentials as the platform payment rail (POST
# /auth/third-party for the bearer, X-Api-Key header). Blank credentials =
# channel disabled (boot-time WARN, outcome=disabled metrics) — deliberately
# NOT boot-required in ProductionSecretsGuard.
innbucks-notify:
  base-url: ${BANK_API_URL:https://staging.innbucks.co.zw}
  api-key: ${BANK_API_KEY:}
  username: ${BANK_API_USERNAME:}
  password: ${BANK_API_PASSWORD:}
  connect-timeout-ms: ${BANK_API_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${BANK_API_READ_TIMEOUT_MS:20000}
  token-ttl: ${BANK_API_TOKEN_TTL:PT8M}
  # Branded HTML emails ON by default (the gateway renders the message field as
  # HTML). NOTIFY_HTML_ENABLED=false rolls back to plain text. LOGO_URL blank =
  # crisp CSS-drawn logo (preferred over a hosted PNG that can proxy faintly).
  html-enabled: ${NOTIFY_HTML_ENABLED:true}
  logo-url: ${NOTIFY_LOGO_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
  # Internal S2S endpoints never appear in the published spec.
  paths-to-exclude: /marketplace/internal/**

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful
  # Never leak internals on the fallback /error path. Handled errors already
  # return the ApiResult envelope via GlobalExceptionHandler.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# Static token the fleet Prometheus presents on X-Metrics-Token to read
# /actuator/prometheus (MetricsScrapeAuthFilter). Blank fail-closes: scraping
# is off until the cell provisions METRICS_SCRAPE_TOKEN — same value
# fleet-wide, lock-step with ticketing-system's prometheus job.
monitoring:
  scrape-token: ${METRICS_SCRAPE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{country:-},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

jwt:
  # Verifies user-service-minted fleet tokens. HS256 shared secret today;
  # OWASP A02 stage-1 RS256/JWKS dual-verify: when JWT_PUBLIC_KEY is set this
  # service verifies BOTH HS256 and RS256 (alg selected per-token). This
  # service only VERIFIES — it never mints; ideally the cell flips user-service
  # to RS256 so marketplace-service holds no mint-capable secret at all.
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration: ${JWT_EXPIRATION_MS:86400000}

---
# OWASP A05: in a deployed cell each backend serves its OpenAPI SPEC ONLY
# (/v3/api-docs) for the gateway to aggregate — the interactive Swagger UI
# stays OFF here (the gateway hosts the single UI behind HTTP Basic).
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

---
# -- Email transport (Amazon SES over SMTP) -----------------------------------
# The InnBucks notification API composes the From header itself, so mail sent
# through it arrives as "Online Banking" whatever product it belongs to.
# Sending our own SMTP message is the only way marketplace mail can say
# "InnBucks Marketplace" (SmtpEmailSender).
#
# Its own YAML document (no on-profile) so it applies to every profile without
# colliding with the top-level spring:/marketplace: keys above — a duplicate
# key in one document is a parse error.
#
# Inactive by default twice over: Spring only auto-configures a JavaMailSender
# when spring.mail.host is set, and SmtpEmailSender also requires
# app.mail.enabled=true. With both unset, delivery is unchanged (notification
# API), so merging this is a no-op until a cell provisions SES credentials.
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
# Mail must NEVER gate readiness. The probe hits the AGGREGATE /actuator/health,
# and Boot's MailHealthIndicator opens a real connection to spring.mail.host —
# which is empty on a cell that has not provisioned SES, so the component
# reports DOWN, the aggregate 503s and the pod never becomes ready (this took
# user-service out on 2026-07-29). Even with SES configured this is the wrong
# signal: email delivery is best-effort with a notification-API fallback, so an
# unreachable SMTP host must not pull the service out of rotation.
management:
  health:
    mail:
      enabled: false
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Must be an SES-verified identity for the region or SES rejects the send.
    from: ${MAIL_FROM:banking@innbucks.co.zw}
    sender-name: ${MAIL_SENDER_NAME:InnBucks Marketplace}
