spring:
  application:
    name: marketplace-service
  data:
    web:
      pageable:
        max-page-size: ${PAGEABLE_MAX_PAGE_SIZE:100}
        default-page-size: ${PAGEABLE_DEFAULT_PAGE_SIZE:20}
    # Shared Redis — read side of the cross-service logout denylist only (no
    # Spring Data Redis repositories). Same Redis the gateway / user-service /
    # loyalty and the rest of the fleet use.
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace_service}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: marketplace-service-pool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      # connection-timeout above only bounds ACQUIRING a connection. These bound
      # what happens on one, so a hung statement, a stuck lock or a leaked
      # transaction fails fast instead of holding a request thread and a pooled
      # connection until TCP gives up. Passed to PgJDBC as driver properties;
      # "options" rides the startup packet, so every pooled connection carries
      # it from birth and a RESET/DISCARD ALL returns to it. A DB_URL that sets
      # its own options= REPLACES this string (PgJDBC: the URL wins).
      #  - statement_timeout 30s: the slowest legitimate statements (the audit
      #    verify over 5000 rows, the 5000-row earnings statement, the payout
      #    report, the stock-drift scan, a catalogue page + count) run in well
      #    under a second today; 30s is headroom for growth, not a target.
      #  - lock_timeout 10s: every explicit lock here (audit_chain_head FOR
      #    UPDATE, listing/option FOR NO KEY UPDATE, the seller row) is held for
      #    one short transaction, so a 10s queue is a stuck holder, not a burst.
      #    Below statement_timeout so a lock wait fails as a LOCK error (55P03).
      #  - idle_in_transaction_session_timeout 60s: a transaction left open
      #    with nothing running (a leak, or remote I/O inside a transaction) is
      #    terminated and its row locks released.
      #  - socketTimeout (SECONDS, client side): the only bound that holds when
      #    the server itself is gone (failover, partition) and its timers cannot
      #    fire. MUST stay above statement_timeout, or a slow-but-legal statement
      #    is cut client-side and the connection discarded.
      # Flyway is EXEMPT: see spring.flyway.url below.
      data-source-properties:
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:30000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:10000} -c idle_in_transaction_session_timeout=${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:60000}"
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:60}
  jpa:
    # OFF, deliberately (Boot defaults it ON). With it on, the request-bound
    # EntityManager keeps the connection of its first query until the response
    # is written — measured: a read with no transaction at all still held one
    # across the seller-name HTTP call. Nothing here needs it: no entity has a
    # lazy association, and every read builds its DTOs where it queries.
    # Pinned by NameLookupHoldsNoConnectionIT.
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only validates.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    locations: classpath:db/migration
    # Flyway gets its OWN unpooled connections (a spring.flyway.url makes Boot
    # build a SimpleDriverDataSource for it) so the timeouts above never reach
    # a migration: an index build or a backfill must never be killed mid-deploy.
    # Same database and credentials as the application. The init-sqls make the
    # exemption hold even against a role- or database-level default, and they
    # can only ever touch Flyway's own connections - on the shared pool a
    # session SET would have gone back into it and stripped the application's
    # timeouts from whichever connection Flyway had borrowed.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    driver-class-name: ${spring.datasource.driver-class-name}
    init-sqls:
      - SET statement_timeout = 0;
      - SET lock_timeout = 0;
      - SET idle_in_transaction_session_timeout = 0;
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        # Threads for the @Scheduled sweeps. Boot's default is ONE, which ran
        # every job serially: a slow collection-overdue run (up to 200 S2S
        # alerts on a degraded user-service) held back the every-minute order
        # expiry sweep, and stock held by lapsed orders outlived its TTL. Six
        # jobs, four of them daily: 4 threads let the every-minute and
        # 15-minute sweeps find a free thread while the slow daily ones run.
        size: ${MARKETPLACE_SCHEDULER_POOL_SIZE:4}
  servlet:
    # Listing image upload cap (POST /marketplace/listings/{id}/image) —
    # mirrors event-service's 10 MB banner cap. ListingService re-checks the
    # size in code and GlobalExceptionHandler maps the container's rejection
    # to the same 400 image_too_large, so both layers speak one contract.
    # max-request-size leaves ~1 MB headroom for the multipart framing.
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

marketplace:
  order:
    # How long a PENDING_PAYMENT order holds its stock before the expiry
    # sweeper releases it. Mirrors the ticketing seat-hold philosophy: a
    # blocked unit of stock beats an oversell, but holds must always lapse.
    payment-ttl-minutes: ${MARKETPLACE_ORDER_PAYMENT_TTL_MINUTES:30}
    # Cap on line items per order and units per line — abuse guard, keeps a
    # single order from reserving a whole listing's stock via one request.
    max-items: ${MARKETPLACE_ORDER_MAX_ITEMS:20}
    max-quantity-per-item: ${MARKETPLACE_ORDER_MAX_QTY_PER_ITEM:25}
  fulfilment:
    # How many wrong collection codes a single parcel tolerates before it
    # locks and the buyer has to mint a fresh one.
    #
    # The budget is small on purpose. The ONLY party who can submit a
    # candidate is the seller already holding that parcel, and what they would
    # be buying with a lucky guess is the instant escrow release that a real
    # handover earns — so this is the number standing between a dishonest
    # seller and their own money, not a convenience dial. Ten is generous for
    # a code read out over a phone.
    collect-code-max-attempts: ${MARKETPLACE_COLLECT_CODE_MAX_ATTEMPTS:10}
    # When a collection that is ready at the counter counts as overdue on the
    # seller's own stats (readyToCollectOverdue). Deliberately well inside the
    # operator's stale-escrow threshold (settlement.stale-after-days, 14), so a
    # seller sees it - and can chase the buyer or close it as not collected -
    # before it becomes somebody else's problem.
    collection-overdue-days: ${MARKETPLACE_COLLECTION_OVERDUE_DAYS:7}
  listing:
    # Hard caps on merchant listing volume (abuse guard).
    max-per-merchant: ${MARKETPLACE_LISTING_MAX_PER_MERCHANT:500}
    # Pixel budget for listing images, read from the header at upload (400
    # image_dimensions_too_large) and again before any server-side resize (an
    # older row over it is served unresized, never decoded). 50 MP admits every
    # phone camera's full-resolution mode (8160 x 6120); the side limit refuses
    # panoramas and strips. It is NOT what protects the heap: the resizer's
    # per-decode byte ceiling and the concurrency limit below do, so raising
    # the budget needs no more heap (and vice versa). See ImagePixelBudget.
    image-max-pixels: ${MARKETPLACE_LISTING_IMAGE_MAX_PIXELS:50000000}
    image-max-side: ${MARKETPLACE_LISTING_IMAGE_MAX_SIDE:8192}
    # Public ?w= resizes allowed to decode at once. Never waits: with none free
    # the original is served (no-store). See ImageDecodePermits.
    image-resize-concurrency: ${MARKETPLACE_LISTING_IMAGE_RESIZE_CONCURRENCY:2}
    # V19 product options (sizes, colours). OFF by default and on production
    # until the super app ships an option picker: it gates only the move INTO
    # options (creating a listing with them, or converting one), so while it
    # is off no listing with options can exist - which is also what keeps a
    # rolling restart and an image rollback safe. Editing an existing listing
    # with options, and dropping its options, stay allowed. Turn it on per
    # cell (staging) the way MARKETPLACE_PUBLIC_TEST_* is set, then restart.
    variants-enabled: ${MARKETPLACE_VARIANTS_ENABLED:false}
    # At most this many options per listing (every option rides every card of
    # the listing, so this bounds the page payload).
    max-variants: ${MARKETPLACE_LISTING_MAX_VARIANTS:50}
  public-test:
    # Unauthenticated PRE-CHECKOUT surface at /marketplace/public/**, for
    # building the super app before POST /auth/exchange is switched on. The
    # marketplace sibling of loyalty's /loyalty/public/** and off for exactly
    # the same reason: the handle in the path is the only identity.
    #
    # It carries the whole BUYER journey: cart, addresses, favorites, checkout
    # quote, AND order / cancel / receipt / dispute / collect-code / review.
    # The order half is gated a second time (see api-key below) because it
    # reserves a merchant's real stock and names the phone that receives a
    # payment PIN prompt. See PublicTestController for the rule on adding to
    # this prefix.
    #
    # DO NOT enable on a production cell. Boot logs an ERROR if you do.
    enabled: ${MARKETPLACE_PUBLIC_TEST_ENABLED:false}
    # Shared key in front of the whole prefix. The key identifies the APP, not
    # the customer: a throttle and a kill switch. Generate:
    # openssl rand -base64 32
    #
    # BLANK IS NOT NEUTRAL — it is the switch for the order half. Blank means
    # the pre-checkout endpoints (cart, addresses, favorites, quote) are served
    # to ANY caller who can reach this cell, while every ORDER endpoint answers
    # 404, identically to a cell that never enabled the surface. That is the
    # deliberate fail-safe for an operator who has enabled the surface and not
    # finished provisioning, and it is the single most likely reason ordering
    # 404s while the cart works. The boot log says which state this cell is in.
    api-key: ${MARKETPLACE_PUBLIC_TEST_API_KEY:}
  checkout:
    # The payment rails GET /marketplace/checkout/options advertises, in
    # the order the app should offer them.
    #
    # MUST mirror what payment-service is actually provisioned with on this
    # cell. Marketplace-service holds no payment credentials and cannot ask —
    # the rails live behind POST /payments, whose ZimSwitch and EcoCash legs
    # each 503 when their credentials are blank. Advertising a rail the cell
    # cannot collect on sends the buyer down a path that dead-ends at another
    # service's error.
    #
    # Hence the fail-safe default: the InnBucks code rail ALONE, which every
    # cell has. Add the others as they are provisioned.
    payment-methods: ${MARKETPLACE_PAYMENT_METHODS:INNBUCKS_CODE}
  delivery:
    # How goods may reach the buyer here. A market with no courier arrangement
    # drops DELIVERY and checkout stops offering it.
    methods: ${MARKETPLACE_DELIVERY_METHODS:DELIVERY,COLLECTION}
    # V20: may a seller turn COLLECTION off and become delivery-only?
    # OFF by default, like variants-enabled: it gates only the move to
    # delivery-only (PUT .../collection {collectionEnabled:false}); turning
    # collection back on is never gated, and a seller already delivery-only
    # stays so when this is switched off. Keep it off until the super app
    # renders sellers[].availableMethods from the quote, or a delivery-only
    # seller's items read as collectable up to the moment the quote refuses.
    delivery-only-sellers-enabled: ${MARKETPLACE_DELIVERY_ONLY_SELLERS_ENABLED:false}
    # V20: may one basket be delivered from one seller and collected from
    # another (sellerDeliveryMethods on the quote and the order)? OFF by
    # default, like delivery-only-sellers-enabled: it gates only a NON-EMPTY
    # choice list (422 seller_delivery_methods_disabled); a body without one
    # behaves exactly as before, and orders already placed with one are never
    # touched when it is switched off. GET /marketplace/checkout/options says
    # perSellerDeliveryMethods: true only when this is on AND the cell offers
    # both methods. Turning delivery-only sellers on with this off logs a WARN
    # at boot: a basket mixing a delivery-only and a collection-only seller
    # then cannot be checked out as one order.
    # ROLLOUT: switch this on ONLY as a separate step, after the V21 image is
    # 100% rolled out - never in the same change as the image. A pod on the
    # previous image ignores sellerDeliveryMethods (and so creates a uniform
    # order from the basket default), and reads the ORDER's method for every
    # parcel, which is wrong for a mixed order. Once a mixed order exists,
    # roll forward only; the rollback check is in V21's header.
    per-seller-methods-enabled: ${MARKETPLACE_PER_SELLER_DELIVERY_METHODS_ENABLED:false}
    # There is no flat delivery fee any more (V14): each listing names the towns
    # it delivers to and the fee for each, and a DELIVERY order pays each
    # seller's fee to the buyer's town. MARKETPLACE_DELIVERY_FEE_CENTS is gone.
    # Abuse guard on the buyer's address book.
    max-addresses-per-buyer: ${MARKETPLACE_MAX_ADDRESSES_PER_BUYER:25}
  tracking:
    # Courier position reports (POST /marketplace/deliveries/{id}/location).
    # Only the LATEST position per parcel is kept — never a route.
    #
    # A report newer than the stored one by less than this is ignored (200,
    # accepted=false): a browser's watchPosition can fire several times a
    # second, and the buyer's map polls far slower than that.
    min-ping-interval-seconds: ${MARKETPLACE_TRACKING_MIN_PING_INTERVAL_SECONDS:5}
    # A fix older than this when it arrives is not "where the parcel is now".
    max-ping-age-seconds: ${MARKETPLACE_TRACKING_MAX_PING_AGE_SECONDS:600}
    # The market's bounding box. A position outside it is refused 422 — almost
    # always a phone with no GPS fix yet reporting 0,0. Defaults are Zimbabwe
    # with a margin; a cell in another market MUST set its own.
    min-latitude: ${MARKETPLACE_TRACKING_MIN_LATITUDE:-22.5}
    max-latitude: ${MARKETPLACE_TRACKING_MAX_LATITUDE:-15.5}
    min-longitude: ${MARKETPLACE_TRACKING_MIN_LONGITUDE:25.0}
    max-longitude: ${MARKETPLACE_TRACKING_MAX_LONGITUDE:33.1}
  seller-stats:
    # Sample floor under the public trust figures (median dispatch time,
    # buyer-confirmed rate). Below it a figure is NULL, never a percentage —
    # "100% confirmed" over two parcels is noise wearing a percentage, and a
    # new seller deserves "new seller", not a verdict.
    min-sample: ${MARKETPLACE_SELLER_STATS_MIN_SAMPLE:5}
  merchant-names:
    # Seller names from user-service's organization registry
    # (UserServiceOrganizationNameResolver), for sellers nobody here has named.
    # The public catalogue waits on this call, so it gets its own tight
    # timeouts rather than the user-service.* ones sized for notifications, and
    # after a failure every page skips it for failure-backoff-seconds instead of
    # each paying the timeout again. ttl-seconds is the staleness budget of the
    # successes-only name cache.
    ttl-seconds: ${MARKETPLACE_MERCHANT_NAMES_TTL_SECONDS:300}
    connect-timeout-ms: ${MARKETPLACE_MERCHANT_NAMES_CONNECT_TIMEOUT_MS:500}
    read-timeout-ms: ${MARKETPLACE_MERCHANT_NAMES_READ_TIMEOUT_MS:1000}
    failure-backoff-seconds: ${MARKETPLACE_MERCHANT_NAMES_FAILURE_BACKOFF_SECONDS:30}
  settlement:
    # The escrow's clocks (V10). All deliberately config, none load-bearing in
    # code: a cell tunes trust economics without a deploy.
    #
    # grace-hours: how long a SELLER-CLOSED delivery stays HELD before the
    # sweeper releases it — the buyer's chance to object to the weaker
    # evidence. A buyer's own confirmation releases immediately and never
    # waits this out. MUST be at least dispute-window-days x 24: the service
    # refuses to start otherwise, because a shorter grace lets a seller's
    # own "delivered" be paid out while the buyer can still dispute it.
    grace-hours: ${MARKETPLACE_SETTLEMENT_GRACE_HOURS:168}
    # How long after DELIVERY a parcel can still be disputed. Undelivered
    # parcels are disputable for as long as the money has not been paid out.
    dispute-window-days: ${MARKETPLACE_SETTLEMENT_DISPUTE_WINDOW_DAYS:7}
    # Platform commission withheld from each settlement, percent of gross.
    # ZERO until the platform decides to charge one — the ledger columns
    # exist so that decision is a config change, not a migration.
    # How long a parcel's money may sit HELD before the stale-escrow sweep
    # counts it as somebody's problem. This is NOT a deadline the system acts
    # on: nothing auto-releases (that would pay a seller who never delivered)
    # and nothing auto-refunds (that would punish one who is merely slow) —
    # both transfers are an operator's to make. It is the age at which the
    # platform admits it is holding money nobody is moving.
    stale-after-days: ${MARKETPLACE_SETTLEMENT_STALE_AFTER_DAYS:14}
    commission-percent: ${MARKETPLACE_SETTLEMENT_COMMISSION_PERCENT:0}
  scheduler:
    # Order-expiry sweep: releases stock held by lapsed PENDING_PAYMENT orders.
    expiry-sweep-cron: ${MARKETPLACE_EXPIRY_SWEEP_CRON:0 * * * * *}
    # Escrow release sweep: promotes HELD settlements whose grace lapsed
    # unchallenged. Every 15 minutes — releases are not urgent, disputes are
    # checked per row, and the grace window is measured in days.
    settlement-release-cron: ${MARKETPLACE_SETTLEMENT_RELEASE_CRON:0 */15 * * * *}
    # Daily is the right cadence for a report nobody can action in minutes.
    stale-escrow-cron: ${MARKETPLACE_STALE_ESCROW_CRON:0 20 6 * * *}
    # Tells a seller, once per parcel, that a collection has waited at their
    # counter longer than fulfilment.collection-overdue-days. Daily, before
    # the working day starts.
    collection-overdue-cron: ${MARKETPLACE_COLLECTION_OVERDUE_CRON:0 0 5 * * *}
    # V19: reports (never repairs) listings whose stock total disagrees with
    # their options - only an out-of-band write can cause one. Daily.
    variant-stock-drift-cron: ${MARKETPLACE_VARIANT_STOCK_DRIFT_CRON:0 17 3 * * *}
    # Nightly tamper-evidence walk over the audit chain.
    audit-verify-cron: ${MARKETPLACE_AUDIT_VERIFY_CRON:0 30 3 * * *}
  audit:
    # Keyed HMAC sealing every audit row + the deletion-evident chain link.
    # Same design as user-service/payment-service (A09). Boot-required under a
    # deployment profile via ProductionSecretsGuard.
    hmac-secret: ${AUDIT_HMAC_SECRET:change-me-audit-hmac-secret-change-me-audit}
    # Newest-window row budget per nightly integrity walk.
    verify-limit: ${MARKETPLACE_AUDIT_VERIFY_LIMIT:5000}
  executors:
    # The notification pools (config/AsyncConfig). Fixed-size; a full
    # queue on the first two DROPS the notice (metered marketplace.notifications.executor_rejected)
    # rather than running it on the thread that just committed a payment
    # confirm. Per-order notices (order paid, parcel updates, refunds, seller
    # alerts): a large queue so only a sustained provider outage drops one.
    notification:
      threads: ${MARKETPLACE_NOTIFY_THREADS:4}
      queue-capacity: ${MARKETPLACE_NOTIFY_QUEUE_CAPACITY:500}
    # Fan-outs (restock alerts, up to max-recipients-per-event calls per task):
    # kept apart so they never queue in front of a per-order notice.
    bulk-notification:
      threads: ${MARKETPLACE_NOTIFY_BULK_THREADS:2}
      queue-capacity: ${MARKETPLACE_NOTIFY_BULK_QUEUE_CAPACITY:50}
    # The payout-destination change notice (V13's anti-redirect control) ALONE:
    # its overflow runs on the caller (the seller's/operator's own request)
    # instead of being dropped, so saturation never loses the warning.
    security-notification:
      threads: ${MARKETPLACE_NOTIFY_SECURITY_THREADS:1}
      queue-capacity: ${MARKETPLACE_NOTIFY_SECURITY_QUEUE_CAPACITY:50}
  notifications:
    restock-alerts:
      # Back-in-stock alerts to favoriters via user-service's internal notify
      # endpoint (AFTER_COMMIT + async, never-throws).
      enabled: ${MARKETPLACE_RESTOCK_ALERTS_ENABLED:true}
      # Per-event recipient cap (oldest favorites win); overflow is logged +
      # metered marketplace.notifications{type=restock_alert,outcome=overflow}.
      max-recipients-per-event: ${MARKETPLACE_RESTOCK_ALERTS_MAX_RECIPIENTS:200}
    merchant-orders:
      # Merchant new-paid-order alerts to the selling organization's OWNERs and
      # ADMINs, via user-service's GET /users/internal/organizations/{id}/admins.
      # ON: against a user-service without that endpoint the lookup 404s and
      # the notifier meters outcome=no_recipients, which is the old behaviour,
      # not a failure.
      enabled: ${MARKETPLACE_MERCHANT_ORDER_ALERTS_ENABLED:true}
    parcel-updates:
      # SMS (WhatsApp fallback) to the buyer when a seller dispatches a parcel,
      # sets it aside for collection, or closes it as delivered on their own
      # word. Leave ON: the "delivered" message is what lets a buyer dispute a
      # false delivery before the escrow pays the seller.
      enabled: ${MARKETPLACE_PARCEL_UPDATES_ENABLED:true}
    seller-alerts:
      # The seller portal's bell (user-service /notifications) for things that
      # need the seller: a dispute, a collection left too long, a payout sent,
      # a buyer our SMS did not reach, a buyer cancelling before dispatch. Sent
      # to every OWNER/ADMIN of the selling organization; never-throws.
      enabled: ${MARKETPLACE_SELLER_ALERTS_ENABLED:true}
      # Where each alert's deepLink points in the portal. {orderRef} is
      # replaced with the order's reference. Change these when the portal's
      # routes change — no client keeps its own type->route map.
      parcel-link: ${MARKETPLACE_SELLER_PARCEL_LINK:/marketplace/parcels?q={orderRef}}
      earnings-link: ${MARKETPLACE_SELLER_EARNINGS_LINK:/marketplace/earnings}

innbucks:
  country: ${INNBUCKS_COUNTRY:ZW}
  currency: ${INNBUCKS_CURRENCY:USD}
  # Shared S2S secret presented as X-Internal-Token on /marketplace/internal/**
  # by the payments service — and BY us on user-service's
  # /users/internal/{uuid}/notify (UserNotifyGateway). Constant-time compared
  # in the controller; the fleet gateway edge-denies the path ("three files
  # must agree").
  internal-api-token: ${INTERNAL_API_TOKEN:change-me-internal-token-change-me-internal-token}

# user-service, resolved by NAME through Eureka (lb via the @LoadBalanced
# builder) — never a hardcoded host:port. Consumed by UserNotifyGateway for
# the S2S notify endpoint (restock alerts, merchant order alerts). The seller-name
# lookup has its own, tighter timeouts under marketplace.merchant-names.
user-service:
  base-url: http://user-service
  connect-timeout-ms: ${USER_SERVICE_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${USER_SERVICE_READ_TIMEOUT_MS:5000}

# External WhatsApp notification gateway — the FALLBACK channel for buyer
# order-paid alerts (third-party service, not in Eureka: explicit base-url).
# Same WHATSAPP_* env vars the rest of the fleet reads; blank api-key =
# channel disabled (boot-time WARN, graceful degradation — never a crash).
whatsapp:
  base-url: ${WHATSAPP_GATEWAY_URL:http://localhost:8089}
  api-key: ${WHATSAPP_API_KEY:}
  connect-timeout-ms: ${WHATSAPP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${WHATSAPP_READ_TIMEOUT_MS:10000}

# InnBucks public notification API (buyer SMS; email available). Same API
# Gateway + BANK_API_* credentials as the platform payment rail (POST
# /auth/third-party for the bearer, X-Api-Key header). Blank credentials =
# channel disabled (boot-time WARN, outcome=disabled metrics) — deliberately
# NOT boot-required in ProductionSecretsGuard.
innbucks-notify:
  base-url: ${BANK_API_URL:https://staging.innbucks.co.zw}
  api-key: ${BANK_API_KEY:}
  username: ${BANK_API_USERNAME:}
  password: ${BANK_API_PASSWORD:}
  connect-timeout-ms: ${BANK_API_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${BANK_API_READ_TIMEOUT_MS:20000}
  token-ttl: ${BANK_API_TOKEN_TTL:PT8M}
  # Branded HTML emails ON by default (the gateway renders the message field as
  # HTML). NOTIFY_HTML_ENABLED=false rolls back to plain text. LOGO_URL blank =
  # crisp CSS-drawn logo (preferred over a hosted PNG that can proxy faintly).
  html-enabled: ${NOTIFY_HTML_ENABLED:true}
  logo-url: ${NOTIFY_LOGO_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs
  # Internal S2S endpoints never appear in the published spec.
  paths-to-exclude: /marketplace/internal/**

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful
  # Never leak internals on the fallback /error path. Handled errors already
  # return the ApiResult envelope via GlobalExceptionHandler.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# Static token the fleet Prometheus presents on X-Metrics-Token to read
# /actuator/prometheus (MetricsScrapeAuthFilter). Blank fail-closes: scraping
# is off until the cell provisions METRICS_SCRAPE_TOKEN — same value
# fleet-wide, lock-step with ticketing-system's prometheus job.
monitoring:
  scrape-token: ${METRICS_SCRAPE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACE_SAMPLE:0.1}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{country:-},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]"

jwt:
  # Verifies user-service-minted fleet tokens. HS256 shared secret today;
  # OWASP A02 stage-1 RS256/JWKS dual-verify: when JWT_PUBLIC_KEY is set this
  # service verifies BOTH HS256 and RS256 (alg selected per-token). This
  # service only VERIFIES — it never mints; ideally the cell flips user-service
  # to RS256 so marketplace-service holds no mint-capable secret at all.
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration: ${JWT_EXPIRATION_MS:86400000}

---
# OWASP A05: in a deployed cell each backend serves its OpenAPI SPEC ONLY
# (/v3/api-docs) for the gateway to aggregate — the interactive Swagger UI
# stays OFF here (the gateway hosts the single UI behind HTTP Basic).
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

---
# -- Email transport (Amazon SES over SMTP) -----------------------------------
# The InnBucks notification API composes the From header itself, so mail sent
# through it arrives as "Online Banking" whatever product it belongs to.
# Sending our own SMTP message is the only way marketplace mail can say
# "InnBucks Marketplace" (SmtpEmailSender).
#
# Its own YAML document (no on-profile) so it applies to every profile without
# colliding with the top-level spring:/marketplace: keys above — a duplicate
# key in one document is a parse error.
#
# Inactive by default twice over: Spring only auto-configures a JavaMailSender
# when spring.mail.host is set, and SmtpEmailSender also requires
# app.mail.enabled=true. With both unset, delivery is unchanged (notification
# API), so merging this is a no-op until a cell provisions SES credentials.
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
# Mail must NEVER gate readiness. The probe hits the AGGREGATE /actuator/health,
# and Boot's MailHealthIndicator opens a real connection to spring.mail.host —
# which is empty on a cell that has not provisioned SES, so the component
# reports DOWN, the aggregate 503s and the pod never becomes ready (this took
# user-service out on 2026-07-29). Even with SES configured this is the wrong
# signal: email delivery is best-effort with a notification-API fallback, so an
# unreachable SMTP host must not pull the service out of rotation.
management:
  health:
    mail:
      enabled: false
app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    # Must be an SES-verified identity for the region or SES rejects the send.
    from: ${MAIL_FROM:banking@innbucks.co.zw}
    sender-name: ${MAIL_SENDER_NAME:InnBucks Marketplace}
